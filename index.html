<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yjjing的前端网页作品集</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="portfolio-container">
    <!-- 顶部标题区 -->
    <header class="portfolio-header">
      <h1>yjjing的前端网页作品集</h1>
      <p>这是我的前端网页作品，点击跳转到具体的页面！</p>
    </header>

    <!-- 作品卡片展示区 -->
    <div class="portfolio-grid">
      
      <!-- 作品 1：Quiz Time -->
      <a href="https://quiz-game-flax-ten.vercel.app/" target="_blank" class="portfolio-card">
        <img src="img/quiztime.png" alt="Quiz Time 截图">
        <div class="card-info">
          <h3>Quiz Time</h3>
          <span class="tag">Quiz</span>
        </div>
      </a>

      <!-- 作品 2：Register Form -->
      <a href="https://register-page-coral.vercel.app/" target="_blank" class="portfolio-card">
        <img src="img/register.png" alt="Register Form 截图">
        <div class="card-info">
          <h3>Register Form</h3>
          <span class="tag">Register</span>
        </div>
      </a>

      <!-- 作品 3：Recipe Finder -->
      <a href="https://menu-search-nu.vercel.app/" target="_blank" class="portfolio-card">
        <img src="img/recipe.png" alt="Recipe Finder 截图">
        <div class="card-info">
          <h3>Recipe Finder</h3>
          <span class="tag">Recipe</span>
        </div>
      </a>

    </div>
  </div>

  <!-- <script src="script.js"></script> -->
